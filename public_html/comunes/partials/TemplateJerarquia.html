<div class="btn-group contenedorJerarquia">
    <a
        href="#"
        ng-if="item.editable"
        jerarquia-control
        tooltip="<lang>Mueve este nodo</lang>"
        tooltip-popup-delay="1000"
    >
        <span class="fa fa-arrows"></span>
    </a>
    <div class="btn dragLista">
        <div class="dragContenido col-xs-9 col-md-10" ng-click="abrecierra()">
            <a class="fa drollDragText" data-nodrag ng-class="{'fa-chevron-right': item.cerrada, 'fa-chevron-down': !item.cerrada}">
                <span class="my-jerarquia-datos TxtSS" data-nodrag>{{item.nombre}}</span>
            </a>
        </div>
        <div class="edicionJerarquia">
            <i
                ng-if="item.editable"
                class="fa fa-times text-danger fa-fw"
                data-nodrag
                ng-click="elimina()"
                tooltip="<lang>Elimina este nodo</lang>"
                tooltip-popup-delay="1000"
            ></i>
            <i
                ng-if="item.editable"
                class="fa fa-plus text-success fa-fw"
                data-nodrag
                ng-click="creaHija()"
                tooltip="<lang>Crea un subnodo</lang>"
                tooltip-popup-delay="1000"
            ></i>
        </div>
    </div>
    <button
        class="btn btn-default gen-comunes-39"
        data-nodrag
        ng-click="item.seleccionada=!item.seleccionada"
        ng-class="{'btn-primary': item.seleccionada,'btn-default': !item.seleccionada}"
        tooltip="<lang>Selecciona este nodo</lang>"
        tooltip-popup-delay="1000"
    >
        <i class="fa fa-check fa-inverse"></i>
    </button>
</div>
<div jerarquia-nodos ng-model="item.hijos">
    <div ng-class="{'hidden': item.cerrada}">
        <li ng-repeat="item in item.hijos" jerarquia-nodo ng-include="'../comunes/loadTemplate.php?templateName=comunes/partials/TemplateJerarquia.html'"></li>
    </div>
</div>
<!-- _FIN_DE_ARCHIVO -->
