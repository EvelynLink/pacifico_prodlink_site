

<div style="height:100%">
    <style>
        #viewAngular{
            height: 100%;
        }
        .contenedorModulo{
            height: auto !important;
            overflow: visible !important;
        }
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%; /* 16/9 ratio */
            padding-top: 30px; /* IE6 workaround*/
            height: 0;
            overflow: hidden;
        }

        .video-responsive iframe,
        .video-responsive object,
        .video-responsive embed {
            position: absolute;
            /*top: 0;*/
            left: 0;
            width: 80%;
            height: 80%;
        }
        /*---------banner secciones--------------------------------------------------------*/
        .bannerSecciones{
            display: flex;
            display: -webkit-flex;
            width: 100%;    
            justify-content:center;
            -webkit-justify-content: center;
            align-items:center; 
            min-height:320px;                      
            background-color: #D5D2D4;
            background-position: bottom;
            background-repeat:no-repeat;
            background-attachment: initial;
            position: relative;     
            -webkit-box-shadow: 10px 0px 9px -7px rgba(0,0,0,0.75);
            -moz-box-shadow: 10px 0px 9px -7px rgba(0,0,0,0.75);
            box-shadow: 10px 0px 9px -7px rgba(0,0,0,0.75);
        }         
        .colorBannerSecciones{
            position: absolute;
            top:0;
            left:0;
            min-height:320px; 
            width:100%;
            background-color: rgba(0,0,0,0.8);
            height:100%;
        }
    </style>
    <style>
        body {
            overflow: hidden;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .fotosGaleria{
            overflow:hidden;height:120px;
        }
        img.bnImage{
            width: 100%;
        }
        .VideoWeb .videoiframe{
            width: 100%;
            max-height: 300px;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        table{
            background: white;
        }
        .inputMessage1 {
            /*border: 10px solid #000;*/
            border-radius: 10px;
            bottom: 20px;
            height: 30px;
            left: 0;
            outline: none;
            padding-left: 5px;
            /*position: absolute;*/
            right: 0;
            width: 100%;
        }
        .chatArea {
            height: 95%;
            padding-bottom: 20px;
            width: 100%;
        }

        .pages {
            height: 80%;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        .fondoTitulo{
            background: #dbdbdb;
        }
        h2.tituloA{
            font-weight: bold;
            font-size: 14px;
            color: #357ebd;
        }
        .txtBold{
            font-weight: bold;
        }
        .color1{
            background: yellow;
        }
        .color2{
            background: white;
        }
    </style>
    <div flex="100" layout="row" layout-align="space-between stretch" style="height:100%;">
        <div flex="100" layout-margin>
            <!--CHATBOT-->
            <div class="panel panel-default">
                <div class="panel-heading" layout="row">
                    <i ng-if="stopGeneralAudio === true" ng-click="stopGAudio()" class="fa fa-reddit-alien fa-red fa-lg"></i>
                    <i ng-if="stopGeneralAudio === false" ng-click="stopGAudio()" class="fa fa-reddit-alien fa-lg"></i>
                    Asistente
                </div>
                <div class="panel-body" layout="column" layout-align="space-between start" style="height:80%">
                    <ul class="chatArea">
                        <li>
                            <ul id="chtbot" class="messages alignMessages" style='height:{{altoPantalla - 250}}px'>
                                <li  class="message" ng-class="{'chatRobot': men.username === 'Chatbot','chatUsuario': men.username !== 'Chatbot'}" ng-repeat="men in mensajes" ng-init="sectionIndex = $index">
                                    <span ng-repeat='msg in men.msg'>
                                        <span style=" font-size: 16px" ng-if="msg.tipo === 'texto'">{{msg.contenido.texto}}</span>
                                        <button ng-if="msg.tipo === 'boton'" type="button" class="btn btn-primary btn-sm" ng-click="evenBoton(msg.contenido.accion);">{{msg.contenido.titulo}}
                                        </button>
                                        <a ng-if="msg.tipo === 'enlace'" target="_blank"  href="http://s3p.espaciolink.com/dct/tmp_adjuntos/tmp_des/{{msg.contenido.url}}">{{msg.contenido.titulo}}</a>
                                        <div familia-de-notas ng-if="msg.tipo === 'nota'">
                                            <div notas keywords="" nota-id="{{msg.contenido.notaId}}" campos="titulo,texto,contenido,galerias,videos,matrizDatos,comentarios,archivos, geodata">
                                                <div ng-repeat="detalleRespuesta in notas.datos" layout="column" style="height:100%">
                                                    <div flex ng-bind-html="detalleRespuesta.contenido"></div>

                                                    <div flex="100" layout="column" ng-if="detalleRespuesta.galerias[0].imagenes.length > 0 || detalleRespuesta.archivos.length > 0 || detalleRespuesta.videos.length > 0">
                                                        <div ng-if="detalleRespuesta.galerias[0].imagenes.length == 1">
                                                            <a href="{{decodeUrl(detalleRespuesta.galerias[0].imagenes[0].url)}}" rel='lightbox[roadtrip]' data-title="{{detalleRespuesta.galerias[0].imagenes[0].metadata.Propiedades_de_Imagen.Autor_o_Propietario[0]}} - {{detalleRespuesta.galerias[0].imagenes[0].metadata.Propiedades_de_Imagen.Pie_de_foto[0]}}">
                                                                <img class="bnImage" ng-src="{{decodeUrl(detalleRespuesta.galerias[0].imagenes[0].url)}}" alt="{{detalleRespuesta.galerias[0].imagenes[0].titulo}}"/>
                                                            </a>
                                                        </div>
                                                        <div class="carousel slide" data-ride="carousel" id="myCarousel_{{detalleRespuesta.id}}" ng-if="detalleRespuesta.galerias[0].imagenes.length > 1">
                                                            <div class="carousel-inner">
                                                                <div id="{{indice}}" class="item centrarImagen" ng-class="{active:$index == 0}" ng-repeat="(indice, imagenBanner1) in detalleRespuesta.galerias[0].imagenes | enfila:2" layout="row" layout-align="center center">
                                                                    <div layout="row"  layout-align="center stretch" layout-padding>
                                                                        <div flex="50" class="fotosGaleria" layout="column" layout-align="center center" ng-repeat="imagenBanner in (detalleRespuesta.galerias[0].imagenes| segmenta:2:$index)">
                                                                            <a href="{{decodeUrl(imagenBanner.url)}}" rel='lightbox[roadtrip]' data-title="{{imagenBanner.metadata.Propiedades_de_Imagen.Autor_o_Propietario[0]}} - {{imagenBanner.metadata.Propiedades_de_Imagen.Pie_de_foto[0]}}">
                                                                                <img class="bnImage" ng-src="{{decodeUrl(imagenBanner.url)}}" alt="{{imagenBanner.titulo}}"/>
                                                                            </a>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div ng-if="detalleRespuesta.galerias[0].imagenes.length > 2">
                                                                <a class="left carousel-control" data-target="#myCarousel_{{detalleRespuesta.id}}" data-slide="prev">
                                                                    <span class="fa fa-chevron-left fa-2x"></span>
                                                                    <span class="sr-only">Previous</span>
                                                                </a>
                                                                <a class="right carousel-control" data-target="#myCarousel_{{detalleRespuesta.id}}" data-slide="next">
                                                                    <span class="fa fa-chevron-right fa-2x"></span>
                                                                    <span class="sr-only">Next</span>
                                                                </a>
                                                            </div>
                                                        </div>
                                                        <div style="margin:40px 20px" ng-if="detalleRespuesta.videos.length > 0">
                                                            <div ng-repeat="vid in detalleRespuesta.videos">
                                                                <div class="VideoWeb" ng-bind-html="muestraComoIframe(vid)"></div>
                                                            </div>
                                                        </div>
                                                        <div style="margin:40px 20px" ng-if="detalleRespuesta.archivos.length > 0">
                                                            <div ng-repeat="miarchivo in detalleRespuesta.archivos">
                                                                <a class="btn btn-primary btn-lg btn-block" href="../dct/{{miarchivo.ruta}}{{miarchivo.nombre}}" alt="{{miarchivo.nombre}}" target="_blank">
                                                                    <i class="fa fa-angle-double-down fa-fw" aria-hidden="true"></i>Descargar Archivo
                                                                </a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </span>
                                    <br/>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <div style=" width: 95%" layout="row" layout-align="space-between start">                                
                        <input id="idMensaje"  class="inputMessage1" placeholder="{{placeHolderInput}}" ng-model="chatbot.input" ng-keypress="mensajeBot($event)"/>
                        <md-fab-speed-dial md-direction="right" md-open="isOpen" style="bottom:15px" class="" ng-class="md - fling" >
                            <md-fab-trigger>
                                <md-button aria-label="cc" class="md-fab md-mini" style="background-color: #F1F2F7" ng-click="cambiarEstadoGrabacion()">
                                    <span ng-if="!grabando" class="md-fab md-raised md-mini"><i class="fa fa-microphone fa-green fa-lg" aria-hidden="true"></i></span>
                                    <span ng-if="grabando" class="md-fab md-raised md-mini"><i class="fa fa-microphone fa-red fa-lg" aria-hidden="true"></i></span>
                                </md-button>
                            </md-fab-trigger>
                        </md-fab-speed-dial>
                    </div>                    
                </div> 
            </div> 
        </div>
    </div>

    <!-- _FIN_DE_ARCHIVO -->
