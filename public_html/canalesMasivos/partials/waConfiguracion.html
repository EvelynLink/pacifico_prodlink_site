<style type="text/css">
    .title {
        margin-left: 0px !important;
        margin-right: 0px !important;
    }

    .panel-body {
        padding: 4px;
    }

    @media screen and (max-width: 600px) {
        .barraMenuFixed {
            position: relative;
            top: auto;
            box-shadow: none;
            -webkit-box-shadow: none;
            -moz-box-shadow: none;
            -ms-box-shadow: none;
        }

        .topCardList {
            min-height: 80px;
        }

        /*[layout-padding], [layout-padding]>[flex-gt-sm], [layout-padding]>[flex-lt-lg], [layout-padding]>[flex-md], [layout-padding]>[flex] {
            padding: 0;
        }*/
    }

    .fondoInputs {
        background-color: #FFF;
        border-radius: 23px;
    }

    md-input-container ._md-placeholder,
    md-input-container label:not(.md-no-float):not(._md-container-ignore) {
        padding-left: 40px;
    }

    .md-headline.f-14 {
        font-size: 12px;
    }
</style>
<div class="panel " style="margin:20px auto;width:98%;position: absolute;margin-top: 5px;" ng-cloak="Cargando...">
    <div flex-gt-sm="100" flex-sm="100" flex-xs="100" flex>
        <div class="panel-heading" layout="row"
            style="margin-top: -10px;height: 45px;background-color: #f8f8fb; border-color: #E8E8E8;"
            layout-align="space-between center">
            <div>
                <span style="color:black;font-size:18px;">Configuración de Whatsapp</span>
            </div>
            <div>
                <button class="btn btn-success" ng-click="nuevo()" tabindex="0"
                    ng-disabled="cargando"><span>+</span></i> </button>
            </div>
        </div>
        <md-content>
            <md-list class="md-dense" flex>
                <md-list-item class="md-1-line row m-1" style="font-weight: bold;">
                    <div flex="15" style="text-align: center;">
                        <lang>Acción</lang>
                    </div>
                    <div flex="25">
                        <lang>Número</lang>
                    </div>
                    <div flex="25">
                        <lang>Cartera</lang>
                    </div>
                    <div flex="25">
                        <lang>Descripción</lang>
                    </div>
                    <div flex="10">
                        <lang>Estado</lang>
                    </div>
                </md-list-item>
                <md-progress-linear md-mode="indeterminate" ng-if="cargando"></md-progress-linear>
                <md-list-item class="md-1-line row m-1 md-no-proxy" ng-repeat="item in data">
                    <div flex="15" style="text-align: center;">
                        <md-button style="margin:0;" ng-if="!item.editar" md-no-ink class="md-primary"
                            ng-click="estadoEditar($index)" ng-disabled="cargando">
                            <md-tooltip md-direction="bottom">
                                <lang>Editar</lang>
                            </md-tooltip>
                            <md-icon md-font-icon="fa fa-pencil" class="favorite-icon"></md-icon>
                        </md-button>
                        <md-button style="margin:0;" ng-if="item.editar" md-no-ink class="md-primary"
                            ng-click="guardar($index)" ng-disabled="cargando">
                            <md-tooltip md-direction="bottom">
                                <lang>Guardar</lang>
                            </md-tooltip>
                            <md-icon md-font-icon="fa fa-floppy-o" class="favorite-icon"></md-icon>
                        </md-button>
                        <md-button ng-if="item.estado!=='Activo'" style="margin:0;" class="md-primary"
                            ng-click="qr($index)" ng-disabled="cargando">
                            <md-tooltip md-direction="bottom">
                                <lang>QR</lang>
                            </md-tooltip>
                            <md-icon md-font-icon="fa fa-qrcode" class="favorite-icon"></md-icon>
                        </md-button>
                        <md-button style="margin:0;" class="md-warn" ng-click="borrar($index)" ng-disabled="cargando">
                            <md-tooltip md-direction="bottom">
                                <lang>Eliminar</lang>
                            </md-tooltip>
                            <md-icon md-font-icon="fa fa-trash" class="favorite-icon"></md-icon>
                        </md-button>
                    </div>
                    <div flex="25">
                        <md-input-container md-no-float class="md-block mr-4 my-0">
                            <input ng-if="item.editar && item.estado!=='Activo'" ng-model="item.numero"
                                placeholder="Número" aria-label="Número" ng-disabled="cargando">
                            <span ng-if="!item.editar || item.estado==='Activo'">{{item.numero}}</span>
                        </md-input-container>
                    </div>
                    <div flex="25">
                        <md-input-container ng-if="item.editar" md-no-float class="md-block mr-4 mt-0 mb-4">
                            <md-select style="width:96%;" ng-model="item.cartera_id" placeholder="Cartera"
                                aria-label="Cartera" ng-change="getNombreCartera($index)">
                                <md-option ng-value="cartera.cartera_id"
                                    ng-repeat="cartera in carteras">{{cartera.cartera_nombre | uppercase}}</md-option>
                            </md-select>
                        </md-input-container>
                        <md-input-container ng-if="!item.editar" md-no-float class="md-block mr-4 my-0">
                            <span>{{item.cartera_nombre | uppercase}}</span>
                        </md-input-container>
                    </div>
                    <div flex="25">
                        <md-input-container md-no-float class="md-block mr-4 my-0">
                            <input ng-if="item.editar" ng-model="item.descripcion" placeholder="Descripción"
                                aria-label="Descripción" ng-disabled="cargando">
                            <span ng-if="!item.editar">{{item.descripcion}}</span>
                        </md-input-container>
                    </div>
                    <div flex="10">
                        <md-input-container md-no-float class="md-block mr-4 my-0">
                            <span>{{item.estado}}</span>
                        </md-input-container>
                    </div>

                </md-list-item>
            </md-list>
        </md-content>
    </div>
</div>

<div ng-show="viewQR" class="modal-backdrop fade in" style="z-index:20;background:black;opacity:0.7;"></div>
<div ng-show="viewQR" class="panel panel-primary"
    style="position: fixed;z-index:1004;margin:20px auto; width:300px;height: 350px; margin-top: 15px;left: 50%; top: 50%;transform: translate(-50%, -50%);">
    <div class="panel-heading" layout="row" layout-align="space-between center">
        <div>QR - {{viewQRnum}}</div>
        <button class="btn btn-success" ng-click="viewQR=false;" tabindex="0"><span>Cerrar</span></button>
    </div>
    <div class="panel-body" layout="column" layout-align="space-between stretch">
        <div style="text-align: center;">
            <img src='{{viewQRhtml}}' />
        </div>
    </div>
</div>

<!-- _FIN_DE_ARCHIVO -->
